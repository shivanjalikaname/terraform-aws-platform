# Plan-on-PR using GitHub OIDC (no stored AWS keys).
#
# Enable it by applying environments/dev once, then setting the repository variable
# AWS_ROLE_ARN to the `github_plan_role_arn` output. Until then the job is skipped.

name: plan

on:
  pull_request:
    paths:
      - "modules/**"
      - "environments/**"

permissions:
  contents: read
  id-token: write      # request the OIDC token
  pull-requests: write # comment the plan on the PR

concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev]
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: gh-plan-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.4

      - run: terraform init -input=false -lock=false
      - id: plan
        run: terraform plan -input=false -lock=false -no-color -out=tfplan

      - name: Comment plan on PR
        uses: actions/github-script@v8
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const body = [
              `### Terraform plan: \`${{ matrix.environment }}\``,
              "<details><summary>Show plan</summary>",
              "",
              "```hcl",
              process.env.PLAN.slice(-60000),
              "```",
              "</details>",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
