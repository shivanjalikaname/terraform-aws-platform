name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TF_VERSION: 1.11.4
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    name: fmt & validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - modules/vpc
          - modules/eks
          - modules/iam-github-oidc
          - environments/dev
          - environments/prod
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - run: terraform fmt -check -recursive -diff
        working-directory: ${{ matrix.dir }}
      - run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}
      - run: terraform validate
        working-directory: ${{ matrix.dir }}

  test:
    name: terraform test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [vpc, eks, iam-github-oidc]
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - run: terraform init -backend=false -input=false
        working-directory: modules/${{ matrix.module }}
      # Uses mock providers: no AWS credentials, no resources created
      - run: terraform test
        working-directory: modules/${{ matrix.module }}

  lint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  security:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: .
          framework: terraform
          quiet: true
          compact: true
